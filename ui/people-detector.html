<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuView Board Monitor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
            min-height: 100vh;
        }
        
        .header {
            background: #12121a;
            border-bottom: 1px solid #1a1a2e;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }
        
        .mode-indicator {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .mode-real {
            background: #00d4aa;
            color: #000;
        }
        
        .mode-sim {
            background: #ff6b00;
            color: #000;
        }
        
        .mode-offline {
            background: #6b7280;
            color: #fff;
        }
        
        .stats-bar {
            display: flex;
            gap: 30px;
            padding: 20px 30px;
            background: #0f0f15;
            border-bottom: 1px solid #1a1a2e;
        }
        
        .stat {
            display: flex;
            flex-direction: column;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #58a6ff;
        }
        
        .stat-label {
            font-size: 12px;
            color: #6b7280;
            text-transform: uppercase;
        }
        
        .main {
            padding: 30px;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 30px;
        }
        
        .board-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .board-card {
            background: #12121a;
            border: 1px solid #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 20px;
            align-items: center;
        }
        
        .board-card.active {
            border-color: #00d4aa;
            animation: active-pulse 2s infinite;
        }
        
        @keyframes active-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0, 212, 170, 0.2); }
            50% { box-shadow: 0 0 20px 5px rgba(0, 212, 170, 0.1); }
        }
        
        .movement-indicator {
            margin-top: 10px;
        }
        
        .variance-bar {
            height: 6px;
            background: #1a1a2e;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 5px;
        }
        
        .variance-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s, background-color 0.3s;
        }
        
        .variance-low { background: #238636; }
        .variance-medium { background: #d29922; }
        .variance-high { background: #da3633; animation: pulse-alert 0.5s infinite; }
        
        @keyframes pulse-alert {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        .movement-label {
            font-size: 11px;
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
        }
        
        .board-number {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
        }
        
        .board-card.active .board-number {
            background: #00d4aa;
            color: #000;
        }
        
        .board-info h3 {
            font-size: 16px;
            margin-bottom: 5px;
        }
        
        .board-meta {
            font-size: 12px;
            color: #6b7280;
        }
        
        .board-status {
            text-align: right;
        }
        
        .status-badge {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }
        
        .status-online {
            background: rgba(0, 212, 170, 0.2);
            color: #00d4aa;
        }
        
        .status-offline {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }
        
        .data-stream {
            background: #0d0d12;
            border: 1px solid #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            font-family: monospace;
            font-size: 11px;
            height: 600px;
            overflow-y: auto;
        }
        
        .data-line {
            padding: 4px 0;
            border-bottom: 1px solid #1a1a2e;
            display: flex;
            gap: 15px;
        }
        
        .data-time {
            color: #6b7280;
            min-width: 60px;
        }
        
        .data-node {
            color: #58a6ff;
            min-width: 50px;
        }
        
        .data-rssi {
            color: #00d4aa;
            min-width: 60px;
        }
        
        .data-detail {
            color: #9ca3af;
        }
        
        .connection-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #12121a;
            border-top: 1px solid #1a1a2e;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .conn-status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        
        .conn-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        
        .conn-dot.online {
            background: #00d4aa;
            box-shadow: 0 0 10px #00d4aa;
        }
        
        .conn-dot.offline {
            background: #ff6b6b;
        }
        
        .conn-dot.connecting {
            background: #ff6b00;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        button {
            padding: 10px 20px;
            background: #238636;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        
        button:hover {
            background: #2ea043;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>π RuView Board Monitor</h1>
        <div class="mode-indicator mode-sim" id="mode-badge">⚠️ SIMULATION</div>
    </div>
    
    <div class="stats-bar">
        <div class="stat">
            <div class="stat-value" id="active-count">0</div>
            <div class="stat-label">Active Boards</div>
        </div>
        <div class="stat">
            <div class="stat-value" id="total-frames">0</div>
            <div class="stat-label">Total Frames</div>
        </div>
        <div class="stat">
            <div class="stat-value" id="data-rate">0</div>
            <div class="stat-label">FPS</div>
        </div>
    </div>
    
    <div class="main">
        <div class="board-list" id="board-list">
            <!-- Boards will be rendered here -->
        </div>
        
        <div class="data-stream" id="data-stream">
            <div style="color: #6b7280; padding: 10px 0;">Waiting for data...</div>
        </div>
    </div>
    
    <div class="connection-bar">
        <div class="conn-status">
            <div class="conn-dot offline" id="conn-dot"></div>
            <span id="conn-text">Disconnected</span>
        </div>
        <div style="display: flex; gap: 10px;">
            <button id="clear-btn" onclick="forceClear()" style="background: #6b7280;">Clear All</button>
            <button id="connect-btn" onclick="toggleConnection()">Connect</button>
        </div>
    </div>
    
    <script>
        const WS_URL = 'ws://localhost:3001/ws/sensing';
        let ws = null;
        let isConnected = false;
        let frameCount = 0;
        let startTime = Date.now();
        let boards = new Map();
        let dataLog = [];
        let maxLogLines = 100;
        
        // Movement detection
        let csiHistory = new Map(); // Store CSI samples per board
        let movementState = new Map(); // Current movement state per board
        
        // Track CSI signatures to detect simulation (real data changes over time)
        let csiSignatures = new Map(); // Store last CSI checksum per node
        let csiChangeCount = new Map(); // Count how many times CSI changed
        
        // Heartbeat to clear stale data
        let lastDataTime = 0;
        let lastRealDataTime = 0;
        setInterval(() => {
            const now = Date.now();
            const timeSinceData = now - lastDataTime;
            const timeSinceRealData = now - lastRealDataTime;
            
            // If no real data for 3 seconds, clear everything
            if (timeSinceRealData > 3000 && boards.size > 0) {
                boards.clear();
                csiHistory.clear();
                movementState.clear();
                
                // Reset mode badge
                const modeBadge = document.getElementById('mode-badge');
                modeBadge.textContent = '⚠️ OFFLINE';
                modeBadge.className = 'mode-indicator mode-offline';
                
                // Reset stats
                document.getElementById('active-count').textContent = '0';
                
                renderBoards();
                logData('SYSTEM', 'All boards offline - no real data');
            }
        }, 1000);
        
        function toggleConnection() {
            if (isConnected) disconnect();
            else connect();
        }
        
        function forceClear() {
            lastDataTime = 0;
            lastRealDataTime = 0;
            frameCount = 0;
            startTime = Date.now();
            boards.clear();
            csiHistory.clear();
            movementState.clear();
            csiSignatures.clear();
            csiChangeCount.clear();
            dataLog = [];
            
            const modeBadge = document.getElementById('mode-badge');
            modeBadge.textContent = '⚠️ OFFLINE';
            modeBadge.className = 'mode-indicator mode-offline';
            
            document.getElementById('active-count').textContent = '0';
            document.getElementById('total-frames').textContent = '0';
            document.getElementById('data-rate').textContent = '0';
            
            renderBoards();
            renderDataStream();
            logData('SYSTEM', 'Manually cleared all data');
        }
        
        function connect() {
            const btn = document.getElementById('connect-btn');
            const dot = document.getElementById('conn-dot');
            const text = document.getElementById('conn-text');
            
            btn.textContent = 'Connecting...';
            btn.disabled = true;
            dot.className = 'conn-dot connecting';
            text.textContent = 'Connecting...';
            
            ws = new WebSocket(WS_URL);
            
            ws.onopen = () => {
                isConnected = true;
                dot.className = 'conn-dot online';
                text.textContent = 'Connected';
                btn.textContent = 'Disconnect';
                btn.disabled = false;
                logData('SYSTEM', 'WebSocket connected');
            };
            
            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    processData(data);
                } catch (e) {
                    console.error('Parse error:', e);
                }
            };
            
            ws.onerror = () => {
                dot.className = 'conn-dot offline';
                text.textContent = 'Error';
                btn.textContent = 'Retry';
                btn.disabled = false;
            };
            
            ws.onclose = () => {
                isConnected = false;
                dot.className = 'conn-dot offline';
                text.textContent = 'Disconnected';
                btn.textContent = 'Connect';
                btn.disabled = false;
                lastDataTime = 0;
                lastRealDataTime = 0;
                boards.clear();
                csiHistory.clear();
                movementState.clear();
                csiSignatures.clear();
                csiChangeCount.clear();
                
                const modeBadge = document.getElementById('mode-badge');
                modeBadge.textContent = '⚠️ OFFLINE';
                modeBadge.className = 'mode-indicator mode-offline';
                document.getElementById('active-count').textContent = '0';
                
                renderBoards();
            };
        }
        
        function disconnect() {
            if (ws) ws.close();
            lastDataTime = 0;
            lastRealDataTime = 0;
            boards.clear();
            csiHistory.clear();
            movementState.clear();
            csiSignatures.clear();
            csiChangeCount.clear();
            
            // Reset mode badge
            const modeBadge = document.getElementById('mode-badge');
            modeBadge.textContent = '⚠️ OFFLINE';
            modeBadge.className = 'mode-indicator mode-offline';
            document.getElementById('active-count').textContent = '0';
            
            renderBoards();
        }
        
        function processData(data) {
            frameCount++;
            const now = Date.now();
            lastDataTime = now; // Track for heartbeat
            
            const elapsed = (now - startTime) / 1000;
            const fps = Math.round(frameCount / elapsed);
            
            // Update stats
            document.getElementById('total-frames').textContent = frameCount;
            document.getElementById('data-rate').textContent = fps;
            
            // Debug: Log what we're receiving
            console.log('WS Data:', { source: data.source, nodes: data.nodes?.length, node_updates: data.node_updates?.length, simulated: data.simulated, type: data.type });
            
            // Detect mode from server data - SIMPLE: trust source field
            const serverSource = data.source || data.data_source || '';
            const isSimulated = data.simulated === true || data.source === 'simulate' || data.type === 'simulation';
            
            // Real data if source is esp32 and not explicitly marked simulated
            const isRealData = serverSource === 'esp32' && !isSimulated;
            
            console.log(`Source: ${serverSource}, isSimulated: ${isSimulated}`);
            
            // Don't trust source field - wait for node validation
            
            // Extract nodes from various data formats
            let nodes = [];
            if (data.nodes && Array.isArray(data.nodes)) {
                nodes = data.nodes;
            } else if (data.node_updates && Array.isArray(data.node_updates)) {
                nodes = data.node_updates;
            } else if (data.node_id) {
                nodes = [data];
            }
            
            // DEBUG: Show first node structure
            if (nodes.length > 0) {
                console.log('First node keys:', Object.keys(nodes[0]));
                console.log('First node:', JSON.stringify(nodes[0]).substring(0, 200));
            }
            
            // REAL DATA DETECTION: Track entropy variance over time
            // Simulation has CONSISTENT entropy, real data has VARYING entropy
            function calculateEntropy(values) {
                if (values.length < 10) return 0;
                const diffs = [];
                for (let i = 1; i < values.length; i++) {
                    diffs.push(Math.abs(values[i] - values[i-1]));
                }
                const mean = diffs.reduce((a,b) => a+b, 0) / diffs.length;
                const variance = diffs.reduce((sum, d) => sum + Math.pow(d - mean, 2), 0) / diffs.length;
                return Math.sqrt(variance);
            }
            
            // Track entropy history per node
            const realNodes = nodes.filter(n => {
                const id = n.node_id || n.id;
                const amplitude = n.amplitude || n.subcarrier_amplitudes || n.subcarriers || [];
                const hasCSI = amplitude.length >= 52;
                const validId = id > 0 && id < 100;
                
                const entropy = calculateEntropy(amplitude);
                
                // Store entropy in history
                if (!csiHistory.has(id)) {
                    csiHistory.set(id, []);
                }
                const history = csiHistory.get(id);
                history.push(entropy);
                if (history.length > 20) history.shift();
                
                // Calculate variance of entropy (how much entropy changes)
                let entropyVariance = 0;
                if (history.length >= 5) {
                    const mean = history.reduce((a,b) => a+b, 0) / history.length;
                    // Check if all values are identical (would cause NaN)
                    const allSame = history.every(e => e === history[0]);
                    if (!allSame && !isNaN(mean)) {
                        entropyVariance = history.reduce((sum, e) => sum + Math.pow(e - mean, 2), 0) / history.length;
                    }
                }
                
                // Protect against NaN
                if (isNaN(entropyVariance)) entropyVariance = 0;
                if (isNaN(entropy)) entropy = 0;
                
                // Real data: entropy varies (high entropyVariance), Simulation: entropy consistent (low entropyVariance)
                const hasVaryingEntropy = entropyVariance > 0.15; // Node 2 seen at 0.267 std-dev
                const hasReasonableEntropy = entropy > 0.5;
                
                const isReal = serverSource === 'esp32' && hasCSI && validId && hasVaryingEntropy && hasReasonableEntropy;
                
                console.log(`Node ${id}: real=${isReal}, entropy=${entropy.toFixed(2)}, entropyVar=${entropyVariance.toFixed(2)}, samples=${history.length}`);
                
                return isReal;
            });
            
            // Determine if we have real CSI data
            const hasRealCSI = nodes.some(n => (n.amplitude || []).length >= 52);
            const actuallyReal = realNodes.length > 0;
            
            console.log(`Real CSI nodes: ${realNodes.length} of ${nodes.length}, hasCSI=${hasRealCSI}`);
            
            // Update mode badge - show REAL if we have CSI data from ESP32 source
            const modeBadge = document.getElementById('mode-badge');
            if (actuallyReal && serverSource === 'esp32') {
                modeBadge.textContent = '🟢 REAL DATA';
                modeBadge.className = 'mode-indicator mode-real';
                lastRealDataTime = now; // Track for heartbeat
            } else if (isSimulated || !hasRealCSI) {
                modeBadge.textContent = '⚠️ SIMULATION';
                modeBadge.className = 'mode-indicator mode-sim';
                console.log('Ignoring - no real CSI data');
                return;
            } else {
                modeBadge.textContent = '⚠️ OFFLINE';
                modeBadge.className = 'mode-indicator mode-offline';
                return;
            }
            
            // Update boards
            let activeCount = 0;
            realNodes.forEach(node => {
                const id = node.node_id || node.id;
                if (!id) return;
                
                const board = boards.get(id) || {
                    id: id,
                    firstSeen: now,
                    frameCount: 0
                };
                
                board.lastSeen = now;
                board.frameCount++;
                // rssi_dbm from server is often 0 (fake), so show as "Unknown"
                const rssiVal = node.rssi_dbm || node.rssi || node.last_rssi;
                board.rssi = (rssiVal !== undefined && rssiVal !== 0) ? rssiVal : -100;
                board.mac = node.mac_address || node.mac || 'Unknown';
                board.channel = node.channel || '-';
                
                // Get subcarrier data for movement detection (use amplitude from server)
                const subcarriers = node.amplitude || node.subcarrier_amplitudes || node.subcarriers || [];
                board.subcarrierCount = subcarriers.length;
                
                boards.set(id, board);
                activeCount++;
                
                // Update movement detection
                updateMovementDetection(id, subcarriers);
                
                // Log data
                const macShort = board.mac && board.mac !== 'Unknown' ? board.mac.substring(0, 8) : 'NO_MAC';
                logData(id, `RSSI: ${board.rssi}dBm | MAC: ${macShort}...`);
            });
            
            document.getElementById('active-count').textContent = activeCount;
            
            // Clean up old boards (inactive > 10s)
            boards.forEach((board, id) => {
                if (now - board.lastSeen > 10000) {
                    boards.delete(id);
                }
            });
            
            renderBoards();
        }
        
        function renderBoards() {
            const container = document.getElementById('board-list');
            
            if (boards.size === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 60px; color: #6b7280;">
                        <div style="font-size: 48px; margin-bottom: 20px;">📡</div>
                        <p>No boards connected</p>
                        <p style="font-size: 12px; margin-top: 10px;">Connect to start monitoring</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = '';
            const now = Date.now();
            
            boards.forEach((board, id) => {
                const age = (now - board.lastSeen) / 1000;
                const isActive = age < 5;
                
                // Get movement state
                const movement = movementState.get(id);
                const hasMovement = movement && (now - movement.lastUpdate < 2000) && !isNaN(movement.score);
                const score = hasMovement ? Math.round(movement.score) : 0;
                const level = hasMovement ? movement.level : 'low';
                
                const macDisplay = board.mac && board.mac !== 'Unknown' ? board.mac : 'Not Available';
                
                const card = document.createElement('div');
                card.className = `board-card ${isActive ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="board-number">${id}</div>
                    <div class="board-info">
                        <h3>ESP32-S3 Node ${id}</h3>
                        <div class="board-meta">
                            MAC: ${macDisplay} | Ch: ${board.channel} | Frames: ${board.frameCount}
                        </div>
                        <div class="movement-indicator">
                            <div class="variance-bar">
                                <div class="variance-fill variance-${level}" style="width: ${score}%"></div>
                            </div>
                            <div class="movement-label">
                                <span>${level === 'high' ? '🏃 MOVEMENT!' : level === 'medium' ? '👋 Activity' : '✓ Static'}</span>
                                <span>${score}% variance</span>
                            </div>
                        </div>
                    </div>
                    <div class="board-status">
                        <div class="status-badge ${isActive ? 'status-online' : 'status-offline'}">
                            ${isActive ? 'ONLINE' : 'STALE'}
                        </div>
                        <div style="font-size: 12px; color: #6b7280; margin-top: 5px;">
                            ${board.rssi} dBm
                        </div>
                        ${hasMovement ? `<div style="font-size: 11px; color: ${level === 'high' ? '#da3633' : level === 'medium' ? '#d29922' : '#238636'}; margin-top: 3px;">
                            ${board.subcarrierCount || 0} subcarriers
                        </div>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }
        
        function logData(nodeId, detail) {
            const time = new Date().toLocaleTimeString('en-US', { 
                hour12: false, 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            });
            
            dataLog.unshift({ time, nodeId, detail });
            if (dataLog.length > maxLogLines) {
                dataLog.pop();
            }
            
            renderDataStream();
        }
        
        function renderDataStream() {
            const container = document.getElementById('data-stream');
            
            if (dataLog.length === 0) {
                container.innerHTML = '<div style="color: #6b7280; padding: 10px 0;">Waiting for data...</div>';
                return;
            }
            
            container.innerHTML = dataLog.map(line => `
                <div class="data-line">
                    <span class="data-time">${line.time}</span>
                    <span class="data-node">[${line.nodeId}]</span>
                    <span class="data-detail">${line.detail}</span>
                </div>
            `).join('');
            
            container.scrollTop = 0;
        }
        
        // Movement Detection Functions
        function updateMovementDetection(nodeId, subcarriers) {
            if (!subcarriers || subcarriers.length === 0) return;
            
            // Initialize history for this node
            if (!csiHistory.has(nodeId)) {
                csiHistory.set(nodeId, []);
            }
            
            const history = csiHistory.get(nodeId);
            
            // Calculate average amplitude of subcarriers
            const avgAmplitude = subcarriers.reduce((a, b) => a + b, 0) / subcarriers.length;
            
            // Calculate variance (spread of values)
            const variance = calculateVariance(subcarriers);
            
            // Add to history
            history.push({
                timestamp: Date.now(),
                avgAmplitude: avgAmplitude,
                variance: variance
            });
            
            // Keep only last 20 samples (about 1 second at 20fps)
            if (history.length > 20) {
                history.shift();
            }
            
            // Detect movement from variance changes
            if (history.length >= 10) {
                const recent = history.slice(-5); // Last 5 samples
                const older = history.slice(-10, -5); // Previous 5 samples
                
                const recentVar = average(recent.map(h => h.variance));
                const olderVar = average(older.map(h => h.variance));
                
                // Movement score based on variance difference
                let movementScore = 0;
                if (!isNaN(recentVar) && !isNaN(olderVar)) {
                    const varDiff = Math.abs(recentVar - olderVar);
                    movementScore = Math.min(100, (varDiff / 50) * 100); // Normalize to 0-100%
                }
                
                // Determine level
                let level = 'low';
                if (movementScore > 30) level = 'high';
                else if (movementScore > 10) level = 'medium';
                
                movementState.set(nodeId, {
                    score: movementScore,
                    level: level,
                    recentVariance: recentVar,
                    lastUpdate: Date.now()
                });
            }
        }
        
        function calculateVariance(values) {
            if (values.length < 2) return 0;
            const mean = values.reduce((a, b) => a + b, 0) / values.length;
            if (isNaN(mean)) return 0;
            const squaredDiffs = values.map(v => Math.pow(v - mean, 2));
            const result = Math.sqrt(squaredDiffs.reduce((a, b) => a + b, 0) / values.length);
            return isNaN(result) ? 0 : result;
        }
        
        function average(values) {
            if (values.length === 0) return 0;
            const result = values.reduce((a, b) => a + b, 0) / values.length;
            return isNaN(result) ? 0 : result;
        }
        
        // Auto-connect on load
        window.onload = () => {
            setTimeout(connect, 500);
        };
    </script>
